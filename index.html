
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reloj Guatemala</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: 'Montserrat', sans-serif;
    background: linear-gradient(
        160deg,
        #302AA5 0%,
        #203CB1 48%,
        #1644B9 100%
    );

    display: flex;
    justify-content: center;
    align-items: center;
    color: #FFFFFF;
}

.contenedor {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2vw;
}

.etiqueta {
    font-size: clamp(18px, 4vw, 46px);
    font-weight: 800;
    font-style: italic;
    margin-bottom: 0.5vw;
}

.hora {
    font-size: clamp(65px, 19vw, 290px);
    font-weight: 900;
    font-style: italic;
    line-height: 0.95;
    letter-spacing: -0.065em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
}

.fecha {
    font-size: clamp(16px, 4vw, 48px);
    font-weight: 400;
    text-transform: uppercase;
    margin-top: 1.5vw;
    letter-spacing: 0.01em;
}

</style>
</head>

<body>

<div class="contenedor">

    <div class="etiqueta">Hora actual</div>

    <div class="hora" id="hora">00:00</div>

    <div class="fecha" id="fecha">Cargando...</div>

</div>

<script>

function actualizarReloj() {

    const ahora = new Date();

    const hora = new Intl.DateTimeFormat('es-GT', {
        timeZone: 'America/Guatemala',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
    });

    const fecha = new Intl.DateTimeFormat('es-GT', {
        timeZone: 'America/Guatemala',
        day: 'numeric',
        month: 'long'
    });

    document.getElementById('hora').textContent =
        hora.format(ahora);

    document.getElementById('fecha').textContent =
        fecha.format(ahora);

}

actualizarReloj();

setInterval(actualizarReloj, 1000);

</script>

</body>
</html>
