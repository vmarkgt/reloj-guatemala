
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RELOJ GUATEMALA</title>

<!-- MONTSERRAT -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,800;1,800&display=swap" rel="stylesheet">

<style>

/* CONFIGURACIÓN GENERAL */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: 'Montserrat', sans-serif;
    color: #FFFFFF;

    background:
        radial-gradient(
            ellipse at 52% -5%,
            rgba(0, 105, 255, 0.95) 0%,
            rgba(0, 75, 210, 0.45) 35%,
            transparent 68%
        ),
        radial-gradient(
            ellipse at 95% 48%,
            rgba(100, 0, 220, 0.65) 0%,
            rgba(65, 0, 150, 0.30) 35%,
            transparent 65%
        ),
        radial-gradient(
            ellipse at 65% 110%,
            rgba(65, 0, 190, 0.55) 0%,
            transparent 60%
        ),
        linear-gradient(
            135deg,
            #030923 0%,
            #07123D 50%,
            #080625 100%
        );
}

/* CONTENEDOR */

.contenedor {
    --clock-size: 200px;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
    padding: 3%;

    gap: calc(var(--clock-size) * 0.035);
}

/* TEXTO SUPERIOR */

.etiqueta {
    font-size: calc(var(--clock-size) * 0.22);
    font-weight: 800;
    font-style: italic;
    text-transform: uppercase;
    line-height: 1.05;
    white-space: nowrap;
}

/* HORA PRINCIPAL */

.hora {
    font-size: var(--clock-size);
    font-weight: 800;
    font-style: italic;

    line-height: 0.95;
    letter-spacing: -0.065em;

    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
}

/* DOS PUNTOS PARPADEANTES */

.dos-puntos {
    display: inline-block;
    animation: parpadeo 1s infinite;
}

@keyframes parpadeo {
    0%, 49% {
        opacity: 1;
    }

    50%, 100% {
        opacity: 0.15;
    }
}

/* FECHA */

.fecha {
    font-size: calc(var(--clock-size) * 0.18);
    font-weight: 400;

    text-transform: uppercase;
    line-height: 1.1;
    white-space: nowrap;
}

/* EVITAR SELECCIONES */

body {
    user-select: none;
    -webkit-user-select: none;
}

</style>
</head>

<body>

<div class="contenedor" id="contenedor">

    <div class="etiqueta" id="etiqueta">
        HORA ACTUAL
    </div>

    <div class="hora" id="hora">
        <span id="horas">00</span><span class="dos-puntos">:</span><span id="minutos">00</span>
    </div>

    <div class="fecha" id="fecha">
        CARGANDO...
    </div>

</div>

<script>

/* =========================================
   ESCALADO AUTOMÁTICO DE TODO EL DISEÑO
========================================= */

const contenedor = document.getElementById('contenedor');
const reloj = document.getElementById('hora');

let ajustePendiente = false;

function ajustarDiseno() {

    const ancho = document.documentElement.clientWidth;
    const alto = document.documentElement.clientHeight;

    if (!ancho || !alto) return;

    // MEDIR EL TAMAÑO REAL DE MONTSERRAT

    reloj.style.fontSize = '100px';

    const medidas = reloj.getBoundingClientRect();

    const proporcionAncho = medidas.width / 100;
    const proporcionAlto = medidas.height / 100;

    // MÁRGENES DE SEGURIDAD

    const anchoDisponible = ancho * 0.94;
    const altoDisponible = alto * 0.90;

    // PROPORCIONES DE LOS TRES TEXTOS:
    // HORA: 100%
    // ETIQUETA: 22%
    // FECHA: 18%

    const alturaTotal =
        proporcionAlto + 0.22 + 0.18 + 0.14;

    // CALCULAR CUÁNTO PUEDE CRECER

    const limiteAncho =
        anchoDisponible / proporcionAncho;

    const limiteAlto =
        altoDisponible / alturaTotal;

    const tamanoFinal = Math.min(
        limiteAncho,
        limiteAlto
    );

    // APLICAR EL MISMO ESCALADO A TODO

    contenedor.style.setProperty(
        '--clock-size',
        tamanoFinal + 'px'
    );

}

// ACTUALIZAR AL CARGAR MONTSERRAT

async function iniciarDiseno() {

    try {
        await document.fonts.load('italic 800 100px Montserrat');
        await document.fonts.load('400 100px Montserrat');
        await document.fonts.ready;
    } catch (error) {
        console.log('Usando fuente alternativa');
    }

    ajustarDiseno();

}

// DETECTAR CAMBIOS DE TAMAÑO

function solicitarAjuste() {

    if (ajustePendiente) return;

    ajustePendiente = true;

    requestAnimationFrame(() => {
        ajustarDiseno();
        ajustePendiente = false;
    });

}

window.addEventListener('resize', solicitarAjuste);
window.addEventListener('orientationchange', solicitarAjuste);

// DETECTAR CAMBIOS DEL ÁREA DEL REPRODUCTOR

if ('ResizeObserver' in window) {

    const observador = new ResizeObserver(() => {
        solicitarAjuste();
    });

    observador.observe(document.documentElement);

}

// INICIAR ESCALADO

iniciarDiseno();


/* =========================================
   RELOJ CON HORA DE GUATEMALA
========================================= */

function actualizarReloj() {

    const ahora = new Date();

    // HORA DE GUATEMALA

    const formatoHora = new Intl.DateTimeFormat('es-GT', {
        timeZone: 'America/Guatemala',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
    });

    const partes = formatoHora.formatToParts(ahora);

    const horas = partes.find(p => p.type === 'hour').value;
    const minutos = partes.find(p => p.type === 'minute').value;

    document.getElementById('horas').textContent = horas;
    document.getElementById('minutos').textContent = minutos;

    // FECHA DE GUATEMALA

    const formatoFecha = new Intl.DateTimeFormat('es-GT', {
        timeZone: 'America/Guatemala',
        day: 'numeric',
        month: 'long'
    });

    document.getElementById('fecha').textContent =
        formatoFecha.format(ahora).toUpperCase();

}

// ACTUALIZAR INMEDIATAMENTE

actualizarReloj();

// ACTUALIZAR CADA SEGUNDO

setInterval(actualizarReloj, 1000);

</script>

</body>
</html>
