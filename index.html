
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RELOJ GUATEMALA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,800;1,800&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: 'Montserrat', sans-serif;
    color: white;

    background:
        radial-gradient(
            ellipse at 52% -5%,
            rgba(0, 105, 255, 0.95) 0%,
            rgba(0, 75, 210, 0.45) 35%,
            transparent 68%
        ),
        radial-gradient(
            ellipse at 95% 48%,
            rgba(100, 0, 220, 0.65) 0%,
            rgba(65, 0, 150, 0.30) 35%,
            transparent 65%
        ),
        radial-gradient(
            ellipse at 65% 110%,
            rgba(65, 0, 190, 0.55) 0%,
            transparent 60%
        ),
        linear-gradient(
            135deg,
            #030923 0%,
            #07123D 50%,
            #080625 100%
        );
}

/* ÁREA COMPLETA */

.pantalla {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* GRUPO TIPOGRÁFICO */

.grupo {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    width: max-content;
    max-width: none;

    font-size: 100px;
    gap: 0.035em;

    white-space: nowrap;

    transform-origin: center center;
    will-change: transform;
}

/* TEXTO SUPERIOR */

.etiqueta {
    font-size: 0.24em;
    font-weight: 800;
    font-style: italic;
    text-transform: uppercase;
    line-height: 1.1;
}

/* HORA */

.hora {
    font-size: 1em;
    font-weight: 800;
    font-style: italic;
    line-height: 0.95;
    letter-spacing: -0.065em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
}

/* DOS PUNTOS */

.dos-puntos {
    display: inline-block;
    animation: parpadeo 1s infinite;
}

@keyframes parpadeo {
    0%, 49% {
        opacity: 1;
    }

    50%, 100% {
        opacity: 0.15;
    }
}

/* FECHA */

.fecha {
    font-size: 0.21em;
    font-weight: 400;
    text-transform: uppercase;
    line-height: 1.1;
    white-space: nowrap;
}

/* SIN SELECCIÓN */

body {
    user-select: none;
    -webkit-user-select: none;
}

</style>
</head>

<body>

<div class="pantalla" id="pantalla">

    <div class="grupo" id="grupo">

        <div class="etiqueta">
            HORA ACTUAL
        </div>

        <div class="hora">
            <span id="horas">00</span><span class="dos-puntos">:</span><span id="minutos">00</span>
        </div>

        <div class="fecha" id="fecha">
            CARGANDO...
        </div>

    </div>

</div>

<script>

/* =====================================
   ESCALADO REAL DE TODO EL CONTENIDO
===================================== */

const pantalla = document.getElementById('pantalla');
const grupo = document.getElementById('grupo');

function ajustarContenido() {

    // DIMENSIONES REALES DEL ÁREA

    const ancho = pantalla.clientWidth;
    const alto = pantalla.clientHeight;

    if (!ancho || !alto) return;

    // QUITAR ESCALA ANTERIOR PARA MEDIR

    grupo.style.transform = 'scale(1)';

    // MEDIR TODO EL BLOQUE TIPOGRÁFICO

    const medidas = grupo.getBoundingClientRect();

    const anchoOriginal = medidas.width;
    const altoOriginal = medidas.height;

    if (!anchoOriginal || !altoOriginal) return;

    // MÁRGENES DE SEGURIDAD

    const anchoDisponible = ancho * 0.96;
    const altoDisponible = alto * 0.92;

    // CALCULAR ESCALA MÁXIMA

    const escalaHorizontal = anchoDisponible / anchoOriginal;
    const escalaVertical = altoDisponible / altoOriginal;

    // UTILIZAR EL MAYOR TAMAÑO POSIBLE SIN RECORTAR

    const escalaFinal = Math.min(
        escalaHorizontal,
        escalaVertical
    );

    // APLICAR ESCALA A LOS TRES TEXTOS JUNTOS

    grupo.style.transform = `scale(${escalaFinal})`;

}

// ESPERAR LA TIPOGRAFÍA

async function iniciar() {

    try {
        await document.fonts.load('italic 800 100px Montserrat');
        await document.fonts.load('400 100px Montserrat');
        await document.fonts.ready;
    } catch (error) {
        console.log('Se utilizará una fuente alternativa');
    }

    ajustarContenido();

}

// DETECTAR CAMBIOS DE DIMENSIONES

let temporizador = null;

function actualizarEscala() {
    clearTimeout(temporizador);
    temporizador = setTimeout(ajustarContenido, 50);
}

window.addEventListener('resize', actualizarEscala);
window.addEventListener('orientationchange', actualizarEscala);

// OBSERVAR EL ÁREA DE REPRODUCCIÓN

if ('ResizeObserver' in window) {

    const observador = new ResizeObserver(actualizarEscala);
    observador.observe(pantalla);

}

// DETECTAR CUANDO CARGA LA FUENTE

document.fonts.addEventListener('loadingdone', ajustarContenido);

// INICIAR

iniciar();


/* =====================================
   HORA ACTUAL DE GUATEMALA
===================================== */

function actualizarReloj() {

    const ahora = new Date();

    // HORA GUATEMALA

    const formatoHora = new Intl.DateTimeFormat('es-GT', {
        timeZone: 'America/Guatemala',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
    });

    const partes = formatoHora.formatToParts(ahora);

    const horas = partes.find(p => p.type === 'hour').value;
    const minutos = partes.find(p => p.type === 'minute').value;

    document.getElementById('horas').textContent = horas;
    document.getElementById('minutos').textContent = minutos;

    // FECHA GUATEMALA

    const formatoFecha = new Intl.DateTimeFormat('es-GT', {
        timeZone: 'America/Guatemala',
        day: 'numeric',
        month: 'long'
    });

    document.getElementById('fecha').textContent =
        formatoFecha.format(ahora).toUpperCase();

}

// ACTUALIZAR RELOJ

actualizarReloj();

setInterval(actualizarReloj, 1000);

</script>

</body>
</html>
