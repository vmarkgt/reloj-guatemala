
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RELOJ GUATEMALA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,800;1,800&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: 'Montserrat', sans-serif;
    color: #FFFFFF;

    background:
        radial-gradient(
            ellipse at 52% -5%,
            rgba(0, 105, 255, 0.95) 0%,
            rgba(0, 75, 210, 0.45) 35%,
            transparent 68%
        ),
        radial-gradient(
            ellipse at 95% 48%,
            rgba(100, 0, 220, 0.65) 0%,
            rgba(65, 0, 150, 0.30) 35%,
            transparent 65%
        ),
        radial-gradient(
            ellipse at 65% 110%,
            rgba(65, 0, 190, 0.55) 0%,
            transparent 60%
        ),
        linear-gradient(
            135deg,
            #030923 0%,
            #07123D 50%,
            #080625 100%
        );

    display: flex;
    justify-content: center;
    align-items: center;
}

/* CONTENEDOR */

.contenedor {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2vmin;
    gap: 0;
}

/* ETIQUETA */

.etiqueta {
    font-size: clamp(20px, 4.5vmin, 90px);
    font-weight: 800;
    font-style: italic;
    text-transform: uppercase;
    margin-bottom: 1vmin;
}

/* HORA PRINCIPAL */

.hora {
    font-size: clamp(48px, 34vmin, 900px);
    font-weight: 800;
    font-style: italic;
    line-height: 0.95;
    letter-spacing: -0.065em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
}

/* DOS PUNTOS */

.dos-puntos {
    display: inline-block;
    animation: parpadeo 1s infinite;
}

@keyframes parpadeo {
    0%, 49% {
        opacity: 1;
    }

    50%, 100% {
        opacity: 0.15;
    }
}

/* FECHA */

.fecha {
    font-size: clamp(18px, 4.2vmin, 85px);
    font-weight: 400;
    text-transform: uppercase;
    margin-top: 2vmin;
    letter-spacing: 0.01em;
}

</style>
</head>

<body>

<div class="contenedor">

    <div class="etiqueta">HORA ACTUAL</div>

    <div class="hora" id="hora">
        00<span class="dos-puntos">:</span>00
    </div>

    <div class="fecha" id="fecha">
        CARGANDO...
    </div>

</div>

<script>

function actualizarReloj() {

    const ahora = new Date();

    // HORA DE GUATEMALA

    const formatoHora = new Intl.DateTimeFormat('es-GT', {
        timeZone: 'America/Guatemala',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
    });

    const partes = formatoHora.formatToParts(ahora);

    const horas = partes.find(p => p.type === 'hour').value;
    const minutos = partes.find(p => p.type === 'minute').value;

    document.getElementById('hora').innerHTML =
        horas + '<span class="dos-puntos">:</span>' + minutos;

    // FECHA DE GUATEMALA

    const formatoFecha = new Intl.DateTimeFormat('es-GT', {
        timeZone: 'America/Guatemala',
        day: 'numeric',
        month: 'long'
    });

    document.getElementById('fecha').textContent =
        formatoFecha.format(ahora).toUpperCase();

}

// ACTUALIZAR RELOJ

actualizarReloj();

setInterval(actualizarReloj, 1000);

</script>

</body>
</html>
