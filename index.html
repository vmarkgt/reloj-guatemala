
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RELOJ GUATEMALA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,800;1,800&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: 'Montserrat', sans-serif;

    background: linear-gradient(
        160deg,
        #302AA5 0%,
        #203CB1 48%,
        #1644B9 100%
    );

    display: flex;
    justify-content: center;
    align-items: center;
    color: #FFFFFF;
}

.contenedor {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2vw;
}

.etiqueta {
    font-size: clamp(18px, 4vw, 46px);
    font-weight: 800;
    font-style: italic;
    text-transform: uppercase;
    margin-bottom: 0.5vw;
}

.hora {
    font-size: clamp(65px, 19vw, 290px);
    font-weight: 800;
    font-style: italic;
    line-height: 0.95;
    letter-spacing: -0.065em;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
}

.dos-puntos {
    display: inline-block;
    animation: parpadeo 1s infinite;
}

@keyframes parpadeo {
    0%, 49% {
        opacity: 1;
    }

    50%, 100% {
        opacity: 0.15;
    }
}

.fecha {
    font-size: clamp(16px, 4vw, 48px);
    font-weight: 400;
    text-transform: uppercase;
    margin-top: 1.5vw;
    letter-spacing: 0.01em;
}

</style>
</head>

<body>

<div class="contenedor">

    <div class="etiqueta">HORA ACTUAL</div>

    <div class="hora" id="hora">
        00<span class="dos-puntos">:</span>00
    </div>

    <div class="fecha" id="fecha">
        CARGANDO...
    </div>

</div>

<script>

function actualizarReloj() {

    const ahora = new Date();

    const formatoHora = new Intl.DateTimeFormat('es-GT', {
        timeZone: 'America/Guatemala',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
    });

    const partes = formatoHora.formatToParts(ahora);

    const horas = partes.find(p => p.type === 'hour').value;
    const minutos = partes.find(p => p.type === 'minute').value;

    document.getElementById('hora').innerHTML =
        horas + '<span class="dos-puntos">:</span>' + minutos;

    const formatoFecha = new Intl.DateTimeFormat('es-GT', {
        timeZone: 'America/Guatemala',
        day: 'numeric',
        month: 'long'
    });

    document.getElementById('fecha').textContent =
        formatoFecha.format(ahora).toUpperCase();

}

actualizarReloj();

setInterval(actualizarReloj, 1000);

</script>

</body>
</html>
